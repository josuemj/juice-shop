# Exclusiones del grupo para corregir falsos positivos del CRS (Hito 3).
#
# Este archivo se monta en el WAF y se carga ANTES de las reglas del CRS.
# Empieza vacio a proposito: primero se corre en DetectionOnly, se revisa en
# Kibana que peticiones LEGITIMAS disparan reglas, y solo entonces se agrega
# aqui una exclusion lo mas especifica posible (una ruta, un parametro, una regla).
#
# Cada exclusion debe documentarse en docs/hito-3/ con:
#   - peticion legitima afectada (ruta, parametro, regla que la disparo)
#   - evidencia (captura de Kibana con fecha y hora)
#   - por que la exclusion no abre la puerta a los ataques del Red Team
#
# Ejemplo (NO activo), quitar la regla 942100 solo para el parametro "comment"
# de la ruta de resenas:
#
# SecRule REQUEST_URI "@beginsWith /rest/products/" \
#     "id:1000,phase:1,pass,nolog,\
#     ctl:ruleRemoveTargetById=942100;ARGS:comment"
#
# Usar IDs de 1000 a 1999 para las reglas propias del grupo.
# Despues de editar: docker compose restart waf