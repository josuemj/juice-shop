# Exclusiones del grupo para corregir falsos positivos del CRS (Hito 3).
#
# Este archivo se monta en el WAF y se carga ANTES de las reglas del CRS.
# Empieza vacio a proposito: primero se corre en DetectionOnly, se revisa en
# Kibana que peticiones LEGITIMAS disparan reglas, y solo entonces se agrega
# aqui una exclusion lo mas especifica posible (una ruta, un parametro, una regla).
#
# Cada exclusion debe documentarse en docs/hito-3/ con:
#   - peticion legitima afectada (ruta, parametro, regla que la disparo)
#   - evidencia (captura de Kibana con fecha y hora)
#   - por que la exclusion no abre la puerta a los ataques del Red Team
#
# Ejemplo (NO activo), quitar la regla 942100 solo para el parametro "comment"
# de la ruta de resenas:
#
# SecRule REQUEST_URI "@beginsWith /rest/products/" \
#     "id:1000,phase:1,pass,nolog,\
#     ctl:ruleRemoveTargetById=942100;ARGS:comment"
#
# Usar IDs de 1000 a 1999 para las reglas propias del grupo.
# Despues de editar: docker compose restart waf
# =============================================================================
# Exclusiones del grupo (H3). Cada una nace de un falso positivo observado en
# DetectionOnly sobre trafico legitimo (ver docs/hito-3/blue-team-h3.md).
# Todas son lo mas especificas posible y NO habilitan ninguna PoC del Red Team
# (V-01..V-06 usan solo GET/POST sobre /rest/products/search, /rest/user/login,
# /rest/basket y /api/Users; ninguna pasa por /rest/user/whoami ni /socket.io/).
# =============================================================================

# FP-1 · 911100 "Method is not allowed by policy"
# Juice Shop es una API REST y usa PUT/PATCH/DELETE de forma legitima (reseñas,
# carrito, direcciones). El CRS solo permite GET/HEAD/POST/OPTIONS por defecto.
# Ampliamos los metodos permitidos. No ayuda al Red Team: sus PoC usan GET/POST.
SecAction \
    "id:1001,phase:1,pass,nolog,t:none,\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# FP-2 · 932260 "Remote Command Execution: Direct Unix Command Execution"
# El endpoint /rest/user/whoami contiene la palabra "whoami" (un comando Unix),
# asi que la regla lo marca por el NOMBRE de la ruta, no por un ataque. Quitamos
# solo la 932260 y solo para esa ruta.
SecRule REQUEST_URI "@beginsWith /rest/user/whoami" \
    "id:1002,phase:1,pass,nolog,ctl:ruleRemoveById=932260"

# FP-3 · 920420 "Request content type is not allowed by policy"
# El canal Socket.IO de la tienda (notificaciones en tiempo real) hace polling
# con un content-type que la regla no permite. Quitamos solo la 920420 y solo
# para /socket.io/. Ninguna PoC del Red Team pasa por este canal.
SecRule REQUEST_URI "@beginsWith /socket.io/" \
    "id:1003,phase:1,pass,nolog,ctl:ruleRemoveById=920420"