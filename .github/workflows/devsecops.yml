# Pipeline DevSecOps del proyecto (Hito 2): SAST, SCA, SBOM y DAST con un
# security gate de no-regresión. Documentación: docs/hito-2/pipeline-devsecops.md
name: "DevSecOps"

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  NPM_VERSION: 11.19.1
  SEMGREP_IMAGE: semgrep/semgrep:1.182.0
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0

jobs:
  sast:
    name: "SAST · Semgrep"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: "Run Semgrep"
        # Sin --error: los hallazgos no fallan el job, el gate decide
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep scan \
            --metrics=off --timeout 30 \
            --config p/javascript \
            --config p/typescript \
            --config p/nodejsscan \
            --config p/owasp-top-ten \
            --config p/secrets \
            --config .semgrep/ \
            --json-output=reports/semgrep.json \
            --sarif-output=reports/semgrep.sarif
      - name: "Upload Semgrep report"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: semgrep-report
          path: reports/
      - name: "Publish findings in Code Scanning"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 #v4.39.1
        with:
          sarif_file: reports/semgrep.sarif
          category: semgrep

  sca:
    name: "SCA · npm audit"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: "Use Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: "Generate lockfiles"
        # El repo no versiona lockfiles (package-lock=false); npm audit los necesita
        run: |
          npm install --global npm@${{ env.NPM_VERSION }}
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --loglevel=error
          cd frontend
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --loglevel=error
      - name: "Audit production dependencies"
        # npm audit sale con 1 si hay vulnerabilidades; el gate decide
        run: |
          mkdir -p reports
          npm audit --omit=dev --json > reports/npm-audit-backend.json || true
          (cd frontend && npm audit --omit=dev --json > ../reports/npm-audit-frontend.json) || true
          cp package-lock.json reports/package-lock.backend.json
          cp frontend/package-lock.json reports/package-lock.frontend.json
      - name: "Upload SCA report"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: sca-report
          path: reports/

  build:
    name: "Build · imagen Docker"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 #v3.8.0
      - name: "Build image from source"
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 #v6.1.0
        with:
          context: .
          file: ./Dockerfile
          tags: juice-shop:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          build-args: |
            VCS_REF=${{ github.sha }}
      - name: "Export image"
        run: docker save juice-shop:ci | gzip > juice-shop-image.tar.gz
      - name: "Upload image"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: image
          path: juice-shop-image.tar.gz
          retention-days: 1
          compression-level: 0

  sbom:
    name: "SBOM · Syft (CycloneDX)"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Download image"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: image
      - name: "Load image"
        run: gunzip -c juice-shop-image.tar.gz | docker load
      - name: "Prepare output folder"
        run: mkdir -p reports
      - name: "Run Syft"
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c #v0.24.3
        with:
          image: juice-shop:ci
          format: cyclonedx-json
          output-file: reports/sbom-juice-shop.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: "Upload SBOM"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: sbom-cyclonedx
          path: reports/

  dast:
    name: "DAST · ZAP baseline"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Download image"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: image
      - name: "Start Juice Shop"
        # Solo se ataca este contenedor efímero del runner (reglas de enfrentamiento)
        run: |
          gunzip -c juice-shop-image.tar.gz | docker load
          docker run -d --name juice-shop -p 3000:3000 juice-shop:ci
          for i in $(seq 1 60); do
            if curl -fs http://localhost:3000/rest/admin/application-version > /dev/null; then
              echo "Juice Shop listo tras ~$((i * 2)) s"
              exit 0
            fi
            sleep 2
          done
          docker logs juice-shop
          exit 1
      - name: "Run ZAP baseline"
        # -I: las advertencias no fallan el job, el gate decide
        run: |
          mkdir -p reports
          chmod 777 reports
          docker run --rm --network host -v "$PWD/reports:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t http://localhost:3000 -j -m 3 -I \
            -J zap-report.json -r zap-report.html -w zap-report.md \
            || echo "zap-baseline terminó con código $?"
      - name: "Save application logs"
        if: always()
        run: docker logs juice-shop > reports/juice-shop.log 2>&1 || true
      - name: "Upload ZAP report"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: zap-report
          path: reports/

  security-gate:
    name: "Security gate"
    needs: [sast, sca, sbom, dast]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Check out Git repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - name: "Use Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Un reporte que falta no rompe la descarga: el gate lo trata como falla (fail-closed)
      - name: "Download Semgrep report"
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: semgrep-report
          path: reports/semgrep-report
      - name: "Download SCA report"
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: sca-report
          path: reports/sca-report
      - name: "Download SBOM"
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: sbom-cyclonedx
          path: reports/sbom-cyclonedx
      - name: "Download ZAP report"
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: zap-report
          path: reports/zap-report
      - name: "Evaluate gate"
        run: node .github/security-gate/gate.mjs reports .github/security-gate/baseline.json reports/gate-result.json
      - name: "Upload gate result"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: gate-result
          path: reports/gate-result.json
